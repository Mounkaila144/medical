# Vhost Apache de Clinoo — copie de référence.
# Installé dans /etc/apache2/sites-available/clinoo.ptrniger.com.conf
# Après modification :  sudo apachectl configtest && sudo systemctl reload apache2
#
#   /api/*      -> backend NestJS  (127.0.0.1:3001, préfixe /api retiré)
#   /socket.io  -> backend (WebSocket)
#   /*          -> frontend Next.js (127.0.0.1:3021)

<VirtualHost *:80>
    ServerName clinoo.ptrniger.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName clinoo.ptrniger.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/clinoo.ptrniger.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/clinoo.ptrniger.com/privkey.pem
    Include               /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests    Off

    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # WebSockets (GraphQL subscriptions, Socket.io)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/api/(.*)     ws://127.0.0.1:3001/$1 [P,L]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:3001/socket.io/$1 [P,L]

    # Backend NestJS
    ProxyPass        /api http://127.0.0.1:3001 nocanon
    ProxyPassReverse /api http://127.0.0.1:3001
    ProxyPass        /health http://127.0.0.1:3001/health nocanon
    ProxyPassReverse /health http://127.0.0.1:3001/health
    ProxyPass        /graphql http://127.0.0.1:3001/graphql nocanon
    ProxyPassReverse /graphql http://127.0.0.1:3001/graphql

    LimitRequestBody 52428800

    # Frontend Next.js — doit rester en dernier
    ProxyPass        / http://127.0.0.1:3021/ nocanon
    ProxyPassReverse / http://127.0.0.1:3021/

    <Location />
      Require all granted
    </Location>

    LogLevel info
    ErrorLog   ${APACHE_LOG_DIR}/clinoo-error.log
    CustomLog  ${APACHE_LOG_DIR}/clinoo-access.log combined
</VirtualHost>
